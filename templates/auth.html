<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1a1917">
  <title>Montor — Ingresar</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232a2a3e'/><circle cx='50' cy='50' r='36' fill='none' stroke='%2360a5fa' stroke-width='6'/><rect x='34' y='54' width='8' height='18' rx='2' fill='%2360a5fa'/><rect x='46' y='46' width='8' height='26' rx='2' fill='%2360a5fa'/><rect x='58' y='36' width='8' height='36' rx='2' fill='%2360a5fa'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #1a1917; --surface: #242220; --surface2: #2d2b28;
      --blue: #4f8cf7; --green: #34d399; --red: #f0576a;
      --text: #f1ede6; --muted: #a39c8f; --border: #3a3733; --red-rgb: 240,87,106;
    }
    body.light {
      --bg: #f3ede2; --surface: #fbf7f0; --surface2: #ede4d3;
      --blue: #3f6fd6; --green: #1f9d6f; --red: #d64a5c;
      --text: #2b2620; --muted: #756b5c; --border: #ddd0b8; --red-rgb: 214,74,92;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse 60% 40% at 15% 0%, rgba(79,140,247,.16), transparent),
        radial-gradient(ellipse 50% 40% at 100% 100%, rgba(157,123,245,.12), transparent),
        var(--bg);
      color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    body.light { background: var(--bg); }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      padding: 32px 28px; width: 100%; max-width: 400px;
    }
    body.light .card { box-shadow: 0 20px 60px rgba(28,32,51,.08); }
    .logo {
      display: flex; justify-content: center; align-items: center; margin: 0 auto 16px;
      width: 64px; height: 64px; border-radius: 18px;
      background: color-mix(in srgb, var(--blue) 14%, transparent);
      color: var(--blue);
    }
    .logo svg { width: 34px; height: 34px; }
    h1 { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 24px; }

    .tabs { display: flex; background: var(--surface2); border-radius: 10px; padding: 4px; margin-bottom: 24px; }
    .tab {
      flex: 1; padding: 9px; text-align: center; border-radius: 8px;
      font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .2s;
    }
    .tab.active { background: var(--blue); color: white; }

    .campo { margin-bottom: 14px; }
    .campo label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; }
    .campo input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 15px; padding: 12px 14px;
      outline: none;
    }
    .campo input:focus { border-color: var(--blue); }

    .btn {
      width: 100%; background: var(--blue); color: white; border: none;
      border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 700;
      cursor: pointer; margin-top: 6px; transition: opacity .2s;
    }
    .btn:active { opacity: .85; }

    .error {
      background: rgba(var(--red-rgb),.1); border: 1px solid rgba(var(--red-rgb),.3);
      color: var(--red); border-radius: 10px; padding: 10px 14px;
      font-size: 13px; margin-bottom: 14px; display: none;
    }
    .error.show { display: block; }

    /* Escritorio: tarjeta más grande y letra más grande (mobile queda igual). */
    @media (min-width: 900px) {
      .card { max-width: 460px; padding: 44px 40px; }
      .logo svg { width: 48px; height: 48px; }
      h1 { font-size: 24px; }
      .subtitle { font-size: 14px; }
      .tab { font-size: 15px; padding: 11px; }
      .campo label { font-size: 13px; }
      .campo input { font-size: 17px; padding: 14px 16px; }
      .btn { font-size: 18px; padding: 17px; }
      .error { font-size: 14px; }
    }
  </style>
</head>
<body>
<div style="position:absolute;top:16px;right:16px;display:flex;gap:8px;align-items:center;">
  <button id="btn-lang" onclick="toggleLang()" style="background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;font-weight:800;padding:6px 10px;cursor:pointer;" title="Switch language">EN</button>
  <button id="btn-modo" onclick="toggleModo()" style="background:none;border:none;cursor:pointer;font-size:20px;line-height:1;padding:4px;" title="Cambiar modo">🌙</button>
</div>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="7"/>
      <rect x="28" y="48" width="9" height="22" rx="3" fill="currentColor"/>
      <rect x="45" y="38" width="9" height="32" rx="3" fill="currentColor"/>
      <rect x="62" y="28" width="9" height="42" rx="3" fill="currentColor"/>
    </svg>
  </div>
  <h1 data-en="Montor">Montor</h1>
  <p class="subtitle" data-en="Manage your income and expenses">Administrá tus ingresos y gastos</p>

  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="setTab('login')" data-en="Sign in">Ingresar</div>
    <div class="tab" id="tab-register" onclick="setTab('register')" data-en="Sign up">Registrarse</div>
  </div>

  <div id="error-msg" class="error"></div>

  <!-- Login -->
  <div id="form-login">
    <div class="campo">
      <label data-en="USERNAME">USUARIO</label>
      <input type="text" id="l-user" placeholder="ej: nico123" autocomplete="username">
    </div>
    <div class="campo">
      <label data-en="PASSWORD">CONTRASEÑA</label>
      <input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" onclick="login()" data-en="Sign in">Ingresar</button>
  </div>

  <!-- Register -->
  <div id="form-register" style="display:none">
    <div class="campo">
      <label data-en="USERNAME">USUARIO</label>
      <input type="text" id="r-user" placeholder="ej: nico123" autocomplete="username">
    </div>
    <div class="campo">
      <label data-en="PASSWORD">CONTRASEÑA</label>
      <input type="password" id="r-pass" placeholder="••••••••" autocomplete="new-password">
    </div>
    <button class="btn" onclick="register()" data-en="Create account">Crear cuenta</button>
    <p style="text-align:center;font-size:11px;color:var(--muted);margin-top:12px;" data-en="By creating an account you agree to our <a href='/terminos' style='color:var(--muted)'>Terms</a> and <a href='/privacidad' style='color:var(--muted)'>Privacy Policy</a>">Al crear una cuenta aceptás nuestros <a href="/terminos" style="color:var(--muted)">Términos</a> y <a href="/privacidad" style="color:var(--muted)">Política de Privacidad</a></p>
  </div>
</div>

<script>
  function applyLang(lang) {
    document.querySelectorAll("[data-en]").forEach(el => {
      if (!el.dataset.es) el.dataset.es = el.innerHTML;
      el.innerHTML = lang === "en" ? el.dataset.en : el.dataset.es;
    });
    document.documentElement.lang = lang;
    document.getElementById("btn-lang").textContent = lang === "en" ? "ES" : "EN";
  }
  function toggleLang() {
    const lang = document.documentElement.lang === "en" ? "es" : "en";
    localStorage.setItem("lang", lang);
    applyLang(lang);
  }
  if (localStorage.getItem("lang") === "en") {
    applyLang("en");
  }

  function toggleModo() {
    const light = document.body.classList.toggle("light");
    document.getElementById("btn-modo").textContent = light ? "☀️" : "🌙";
    localStorage.setItem("modo", light ? "light" : "dark");
  }
  if (localStorage.getItem("modo") === "light") {
    document.body.classList.add("light");
    document.getElementById("btn-modo").textContent = "☀️";
  }

  function setTab(t) {
    document.getElementById("tab-login").classList.toggle("active", t === "login");
    document.getElementById("tab-register").classList.toggle("active", t === "register");
    document.getElementById("form-login").style.display    = t === "login"    ? "" : "none";
    document.getElementById("form-register").style.display = t === "register" ? "" : "none";
    ocultarError();
  }

  const ERRORS = {
    invalid_credentials: { es: "Usuario o contraseña incorrectos", en: "Incorrect username or password" },
    missing_fields:      { es: "Completá todos los campos",        en: "Fill in all fields" },
    username_taken:      { es: "Ese nombre de usuario ya está en uso", en: "That username is already taken" },
    weak_password:       { es: "La contraseña tiene que tener al menos 8 caracteres", en: "Password must be at least 8 characters" },
    too_many_attempts:   { es: "Demasiados intentos. Probá de nuevo en unos minutos", en: "Too many attempts. Try again in a few minutes" },
  };
  function t(code) {
    const lang = document.documentElement.lang === "en" ? "en" : "es";
    const entry = ERRORS[code];
    return entry ? entry[lang] : code;
  }

  function mostrarError(code) {
    const el = document.getElementById("error-msg");
    el.textContent = t(code); el.classList.add("show");
  }
  function ocultarError() {
    document.getElementById("error-msg").classList.remove("show");
  }

  async function login() {
    const username = document.getElementById("l-user").value.trim();
    const pass     = document.getElementById("l-pass").value;
    if (!username || !pass) { mostrarError("missing_fields"); return; }

    const r = await fetch("/api/montor/login", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ username, password: pass })
    });
    const data = await r.json();
    if (data.ok) window.location.href = "/montor";
    else mostrarError(data.error);
  }

  async function register() {
    const username = document.getElementById("r-user").value.trim();
    const pass     = document.getElementById("r-pass").value;
    if (!username || !pass) { mostrarError("missing_fields"); return; }

    const r = await fetch("/api/montor/register", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ username, password: pass })
    });
    const data = await r.json();
    if (data.ok) window.location.href = "/montor";
    else mostrarError(data.error);
  }

  // Enter para enviar
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    if (document.getElementById("form-login").style.display !== "none") login();
    else register();
  });
</script>
</body>
</html>
